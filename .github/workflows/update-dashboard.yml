name: Update Dashboard

on:
  schedule:
    # 한국시간 오전 10시, 낮 12시, 오후 2시 (UTC 1,3,5시), 평일만
    # 예약 실행 누락을 줄이기 위해 시간 간격을 넓혀 하루 3회로 조정함
    - cron: '0 1,3,5 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python scrape_and_build.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          git add index.html data/
          git diff --staged --quiet || git commit -m "Auto-update dashboard $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push
